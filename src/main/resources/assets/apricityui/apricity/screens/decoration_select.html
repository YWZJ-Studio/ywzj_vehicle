<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">

    <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            overflow: hidden;
        }

        .decoration-screen {
            color: var(--ore-ink);
            background: var(--ore-canvas);
            font-family: OreRegular, "Microsoft YaHei";
            display: flex;
            flex-direction: column;
        }

        body.ore-theme.decoration-screen .navbar-brand,
        body.ore-theme.decoration-screen .card-header,
        body.ore-theme.decoration-screen .button {
            font-family: OreDisplay, "Microsoft YaHei";
        }

        body.ore-theme.decoration-screen .form-input {
            font-family: OreRegular, "Microsoft YaHei";
        }

        .decoration-screen .decoration-navbar {
            min-height: 38px;
            padding: 6px 10px 10px;
            flex: 0 0 auto;
        }

        body.ore-theme.decoration-screen .navbar-brand {
            font-size: 18px;
            line-height: 1.1;
        }

        .decoration-workspace {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            gap: 7px;
        }

        .decoration-screen .decoration-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .decoration-screen .card-header {
            min-height: 30px;
            padding: 8px 9px;
            font-size: 11px;
            flex: 0 0 auto;
        }

        .decoration-screen .card-body {
            min-height: 0;
            padding: 7px;
        }

        .catalog-panel {
            width: 43%;
            flex: 0 0 43%;
        }

        .catalog-panel .card-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .decoration-screen .form-input {
            min-height: 29px;
            padding: 5px 7px;
            border-width: 2px;
            font-size: 10px;
            flex: 0 0 auto;
        }

        .decoration-grid {
            min-height: 0;
            padding: 4px;
            border: 2px solid var(--ore-edge);
            background: #2d2e30;
            overflow-x: hidden;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(6, 48px);
            grid-auto-rows: 48px;
            align-content: start;
            justify-content: center;
            gap: 4px;
            flex: 1 1 auto;
        }

        .decoration-entry {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            max-width: 48px;
            max-height: 48px;
            padding: 2px;
            box-sizing: border-box;
            border: 2px solid #55575a;
            background: #3b3c3e;
            box-shadow: inset 2px 2px #292a2c, inset -2px -2px #47494c;
            cursor: pointer;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        .decoration-entry:hover,
        .decoration-entry:focus {
            border-color: #ddd3b1;
            background: #4b4c4f;
        }

        .decoration-entry.active {
            border-color: var(--ore-gold);
            background: #514a35;
            box-shadow: inset 2px 2px #302c20, inset -2px -2px #6a6044;
        }

        .decoration-thumbnail,
        .decoration-texture {
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            max-width: 40px;
            max-height: 40px;
            display: block;
            flex: 0 0 40px;
        }

        .empty-state {
            padding: 9px 6px;
            color: var(--ore-ink-muted);
            font-size: 9px;
            text-align: center;
        }

        .detail-column {
            min-width: 0;
            min-height: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .preview-panel {
            min-height: 0;
            flex: 3 1 0;
        }

        .preview-panel .card-body {
            position: relative;
            padding: 0;
            background: #252628;
            overflow: hidden;
            flex: 1 1 auto;
        }

        .preview-viewport {
            position: absolute;
            top: 5px;
            right: 5px;
            bottom: 5px;
            left: 5px;
            border: 2px solid #56585b;
            background: #303133;
            box-shadow: inset 3px 3px #222325, inset -3px -3px #444649;
        }

        .preview-axis-x,
        .preview-axis-y {
            position: absolute;
            background: #3e4043;
        }

        .preview-axis-x {
            top: 50%;
            right: 7px;
            left: 7px;
            height: 1px;
        }

        .preview-axis-y {
            top: 7px;
            bottom: 7px;
            left: 50%;
            width: 1px;
        }

        #decoration-preview {
            position: absolute;
            top: 7px;
            right: 7px;
            bottom: 7px;
            left: 7px;
            cursor: grab;
            user-select: none;
        }

        #decoration-preview.dragging {
            cursor: grabbing;
        }

        .profile-panel {
            min-height: 92px;
            flex: 2 1 0;
        }

        .profile-panel .card-body {
            display: flex;
            flex-direction: column;
            gap: 7px;
            overflow: hidden;
        }

        .profile-identity {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex: 0 0 auto;
        }

        #selected-decoration-name {
            min-width: 0;
            color: #ffffff;
            font-family: OreDisplay, "Microsoft YaHei";
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
        }

        #selected-decoration-id {
            max-width: 42%;
            white-space: nowrap;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .profile-description {
            width: 100%;
            min-height: 0;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            padding: 7px;
            border: 2px solid var(--ore-edge);
            color: var(--ore-ink-muted);
            background: #343537;
            font-family: OreRegular, "Microsoft YaHei";
            font-size: 14px;
            line-height: 1.35;
            letter-spacing: 0;
            text-align: left;
            white-space: normal;
            overflow-x: hidden;
            overflow-y: auto;
            flex: 1 1 auto;
        }

        .decoration-screen .close-button {
            width: 30px;
            height: 26px;
            min-height: 26px;
            padding: 3px 7px 7px;
            font-size: 14px;
            line-height: 1;
            flex: 0 0 30px;
        }

        /* Keep the catalog and detail surfaces at the machine screen scale. */
        .preview-viewport { inset: 5px; }
        .decoration-entry { border-width: 2px; }

        @media (max-width: 560px) {
            .catalog-panel {
                width: 44%;
                flex-basis: 44%;
            }

            .decoration-grid {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="screen-common.css">
</head>
<body class="ore-theme decoration-screen">
    <nav class="navbar decoration-navbar">
        <div class="navbar-brand">
            <translation>screen.decoration_select.title</translation>
        </div>
        <button id="close-button" class="button button-danger close-button" type="button" aria-label="Close">X</button>
    </nav>

    <main class="decoration-workspace">
        <aside class="card card-accent-green decoration-panel catalog-panel">
            <div class="card-header split">
                <span><translation>screen.decoration_select.catalog</translation></span>
                <span id="decoration-count" class="badge">0</span>
            </div>
            <div class="card-body">
                <input id="decoration-search" class="form-input" type="text" placeholder="Search / 搜索">
                <div id="decoration-grid" class="decoration-grid"></div>
                <div id="decoration-grid-empty" class="empty-state hidden">
                    <translation>screen.decoration_select.no_results</translation>
                </div>
            </div>
        </aside>

        <div class="detail-column">
            <section class="card card-accent-purple decoration-panel preview-panel">
                <div class="card-header split">
                    <span><translation>screen.decoration_select.preview</translation></span>
                    <span class="badge badge-purple">3D</span>
                </div>
                <div class="card-body">
                    <div class="preview-viewport">
                        <div class="preview-axis-x"></div>
                        <div class="preview-axis-y"></div>
                        <div id="decoration-preview"></div>
                    </div>
                </div>
            </section>

            <section class="card card-accent-purple decoration-panel profile-panel">
                <div class="card-header"><translation>screen.decoration_select.profile</translation></div>
                <div class="card-body">
                    <div class="profile-identity">
                        <span id="selected-decoration-name"><translation>screen.decoration_select.preview</translation></span>
                        <span id="selected-decoration-id" class="badge badge-purple">--</span>
                    </div>
                    <div id="decoration-description" class="profile-description">
                        <translation>screen.decoration_select.select_decoration</translation>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
