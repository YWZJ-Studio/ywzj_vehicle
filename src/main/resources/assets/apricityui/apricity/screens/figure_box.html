<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        .figure-screen { color: var(--ore-ink); background: var(--ore-canvas); display: flex; flex-direction: column; font-family: OreRegular, "Microsoft YaHei"; }
        body.ore-theme.figure-screen .navbar-brand { font-size: 18px; line-height: 1.1; }
        .figure-screen .navbar { min-height: 38px; padding: 6px 10px 10px; flex: 0 0 auto; }
        .figure-screen .navbar-brand, .figure-screen .card-header, .figure-screen .button { font-family: OreDisplay, "Microsoft YaHei"; }
        .figure-workspace { display: flex; gap: 8px; padding: 8px; min-height: 0; flex: 1 1 auto; }
        .figure-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .settings-panel { width: 42%; flex: 0 0 42%; }
        .preview-panel { flex: 1 1 auto; }
        .figure-screen .card-header { min-height: 30px; padding: 8px 9px; font-size: 11px; flex: 0 0 auto; }
        .settings-panel .card-body { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
        .setting-row { display: flex; align-items: center; gap: 7px; min-height: 30px; }
        .setting-label { width: 38%; color: var(--ore-ink-muted); font-size: 12px; flex: 0 0 38%; }
        .setting-input { min-width: 0; flex: 1 1 auto; }
        .form-input.setting-input { min-height: 28px; padding: 5px 7px; border-width: 2px; font-size: 12px; }
        .range-input { min-width: 0; margin: 0; flex: 1 1 auto; accent-color: var(--ore-gold); }
        .form-input.range-value-input { width: 68px; min-width: 68px; min-height: 26px; padding: 4px 5px; color: var(--ore-gold); font-family: OreDisplay, "Microsoft YaHei"; font-size: 12px; text-align: right; flex: 0 0 68px; }
        .check-row { padding: 4px 0; color: #fff; font-size: 11px; }
        .button-row { display: flex; gap: 7px; margin-top: auto; padding-top: 8px; }
        .button-row .button { flex: 1 1 auto; min-height: 32px; }
        .preview-panel .card-body { position: relative; padding: 0; background: #252628; overflow: hidden; flex: 1 1 auto; }
        .preview-viewport { position: absolute; inset: 6px; border: 2px solid #56585b; background: #303133; box-shadow: inset 3px 3px #222325, inset -3px -3px #444649; }
        #figure-box-preview { position: absolute; inset: 8px; }
        /* Match the full-size machine screen controls. */
        .figure-workspace { gap: 7px; padding: 7px; }
        .setting-row { min-height: 36px; gap: 8px; }
        .setting-label { font-size: 14px; }
        .form-input.setting-input { min-height: 32px; padding: 6px 8px; font-size: 14px; }
        .range-input { min-height: 20px; }
        .form-input.range-value-input { width: 76px; min-width: 76px; min-height: 30px; padding: 5px 6px; font-size: 14px; }
        .check-row { padding: 6px 0; font-size: 14px; }
        .button-row { gap: 8px; padding-top: 10px; }
        .button-row .button { min-height: 34px; font-size: 12px; }
        .preview-viewport { inset: 5px; }
        @media (max-width: 560px) { .settings-panel { width: 46%; flex-basis: 46%; } .setting-label { width: 44%; flex-basis: 44%; } }
    </style>
    <link rel="stylesheet" href="screen-common.css">
</head>
<body class="ore-theme figure-screen">
    <nav class="navbar"><div class="navbar-brand"><translation>screen.figure_box.title</translation></div></nav>
    <main class="figure-workspace">
        <section class="card card-accent-gold figure-panel settings-panel">
            <div class="card-header"><translation>screen.figure_box.settings</translation></div>
            <div class="card-body">
                <div class="setting-row"><span class="setting-label"><translation>edit_box.scale</translation></span><input id="figure-box-scale" class="form-input setting-input" type="number" step="0.1"></div>
                <div class="setting-row"><span class="setting-label"><translation>edit_box.x_shift</translation></span><input id="figure-box-x-shift" class="form-input setting-input" type="number" step="0.1"></div>
                <div class="setting-row"><span class="setting-label"><translation>edit_box.y_shift</translation></span><input id="figure-box-y-shift" class="form-input setting-input" type="number" step="0.1"></div>
                <div class="setting-row"><span class="setting-label"><translation>edit_box.z_shift</translation></span><input id="figure-box-z-shift" class="form-input setting-input" type="number" step="0.1"></div>
                <div class="setting-row"><span class="setting-label"><translation>slider.x_rot</translation></span><input id="figure-box-x-rotation" class="range-input" type="range" min="-180" max="180" step="0.01"><input id="figure-box-x-rotation-value" class="form-input range-value-input" type="text" inputmode="decimal"></div>
                <div class="setting-row"><span class="setting-label"><translation>slider.y_rot</translation></span><input id="figure-box-y-rotation" class="range-input" type="range" min="-180" max="180" step="0.01"><input id="figure-box-y-rotation-value" class="form-input range-value-input" type="text" inputmode="decimal"></div>
                <div class="setting-row"><span class="setting-label"><translation>slider.z_rot</translation></span><input id="figure-box-z-rotation" class="range-input" type="range" min="-180" max="180" step="0.01"><input id="figure-box-z-rotation-value" class="form-input range-value-input" type="text" inputmode="decimal"></div>
                <label class="check-row"><input id="figure-box-open" type="checkbox"> <translation>check_box.figure_box.open</translation></label>
                <div class="button-row"><button id="close-button" class="button button-primary" type="button"><translation>button.done</translation></button></div>
            </div>
        </section>
        <section class="card card-accent-purple figure-panel preview-panel">
            <div class="card-header"><translation>screen.figure_box.preview</translation></div>
            <div class="card-body"><div class="preview-viewport"><div id="figure-box-preview"></div></div></div>
        </section>
    </main>
</body>
</html>
